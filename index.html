<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For You</title>
    <meta name="description" content="A special birthday celebration">
    <link rel="stylesheet" href="style.css" />
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>❤️</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Inter:wght@200;300;400;500&display=swap"
        rel="stylesheet">
</head>

<body class="love-mood">

    <!-- Background Music & Toggle -->
    <audio id="bg-music" loop>
        <source src="music.mp3" type="audio/mpeg">
    </audio>
    <button id="music-toggle" class="music-btn" aria-label="Toggle music">
        <svg id="music-icon-play" class="music-icon" fill="currentColor" viewBox="0 0 24 24">
            <path d="M8 5v14l11-7z" />
        </svg>
        <svg id="music-icon-pause" class="music-icon hidden" fill="currentColor" viewBox="0 0 24 24">
            <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z" />
        </svg>
    </button>
    <button id="mood-toggle" class="mood-btn" aria-label="Toggle mood">
        <svg class="mood-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path
                d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z">
            </path>
        </svg>
    </button>

    <!-- ═══════════════════════════════════════ -->
    <!-- PASSCODE SCREEN                         -->
    <!-- ═══════════════════════════════════════ -->
    <div id="passcode-screen" class="passcode-screen">
        <div class="passcode-content">
            <p class="passcode-label">The Day Everything Changed for both of US </p>
            <div class="passcode-dots" id="passcode-dots">
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>
            </div>
            <p class="passcode-error" id="passcode-error">It's the Date Baby</p>
            <div class="numpad" id="numpad">
                <button class="numpad-key" data-key="1">1</button>
                <button class="numpad-key" data-key="2">2</button>
                <button class="numpad-key" data-key="3">3</button>
                <button class="numpad-key" data-key="4">4</button>
                <button class="numpad-key" data-key="5">5</button>
                <button class="numpad-key" data-key="6">6</button>
                <button class="numpad-key" data-key="7">7</button>
                <button class="numpad-key" data-key="8">8</button>
                <button class="numpad-key" data-key="9">9</button>
                <button class="numpad-key numpad-empty"></button>
                <button class="numpad-key" data-key="0">0</button>
                <button class="numpad-key numpad-del" data-key="del">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z" />
                        <line x1="18" y1="9" x2="12" y2="15" />
                        <line x1="12" y1="9" x2="18" y2="15" />
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <!-- ═══════════════════════════════════════ -->
    <!-- MAIN CONTENT                            -->
    <!-- ═══════════════════════════════════════ -->
    <main id="main-content" class="main-hidden">

        <!-- Section 1: Hero - Full screen image + text -->
        <section id="hero" class="hero-section">
            <div class="hero-image-wrapper">
                <img src="main.jpeg.jpg" alt="Purva" class="hero-image" id="hero-image">
                <div class="hero-image-overlay"></div>
            </div>
            <div class="hero-text-container" id="hero-text">
                <h1 class="hero-title">Happy Birthday Baby❤️</h1>
            </div>
            <div class="scroll-indicator" id="scroll-indicator">
                <span>Scroll</span>
                <div class="scroll-line"></div>
            </div>
        </section>

        <!-- Section 2: Gifts -->
        <section id="gifts" class="gifts-section">
            <div class="gifts-header">
                <div class="gifts-line"></div>
                <h3 class="gifts-title">These are some small gifts...</h3>
                <p class="gifts-subtitle">Click to unwrap</p>
            </div>
            <div class="gifts-grid">
                <a href="paragraphs.html" class="gift-card" id="gift-1">
                    <div class="gift-image-wrapper">
                        <img src="assets/gift1.png" alt="Gift 1" class="gift-image">
                    </div>
                    <span class="gift-label">Something special</span>
                </a>
                <a href="best-moments.html" class="gift-card" id="gift-2">
                    <div class="gift-image-wrapper">
                        <img src="assets/gift2.png" alt="Gift 2" class="gift-image">
                    </div>
                    <span class="gift-label">It's Just US </span>
                </a>
                <a href="best-of-purva.html" class="gift-card" id="gift-3">
                    <div class="gift-image-wrapper">
                        <img src="assets/gift3.png" alt="Gift 3" class="gift-image">
                    </div>
                    <span class="gift-label">Babyy</span>
                </a>
            </div>
        </section>

    </main>

    <!-- Scripts -->
    <script src="https://unpkg.com/@studio-freight/lenis@1.0.42/dist/lenis.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script src="script.js"></script>
</body>

</html>
