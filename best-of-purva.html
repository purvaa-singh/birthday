<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Best of Purva</title>
    <meta name="description" content="My favorite pictures of you">
    <link rel="stylesheet" href="style.css" />
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>❤️</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Inter:wght@200;300;400;500&display=swap"
        rel="stylesheet">
</head>

<body>

    <!-- Background Music & Toggle -->
    <audio id="bg-music" loop>
        <source src="music.mp3" type="audio/mpeg">
    </audio>
    <button id="music-toggle" class="music-btn" aria-label="Toggle music">
        <svg id="music-icon-play" class="music-icon" fill="currentColor" viewBox="0 0 24 24">
            <path d="M8 5v14l11-7z" />
        </svg>
        <svg id="music-icon-pause" class="music-icon hidden" fill="currentColor" viewBox="0 0 24 24">
            <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z" />
        </svg>
    </button>
    <button id="mood-toggle" class="mood-btn" aria-label="Toggle mood">
        <svg class="mood-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
        </svg>
    </button>

    <!-- Main Content -->
    <main id="main-content" class="main-hidden">

        <!-- Back Link -->
        <a href="index.html" class="back-link">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M10 19l-7-7m0 0l7-7m-7 7h18">
                </path>
            </svg>
            Home
        </a>

        <!-- Hero Text -->
        <div class="float-hero" id="float-hero">
            <div class="subpage-hero-line"></div>
            <h1 class="float-hero-title">My favorite pictures of you</h1>
            <p class="float-hero-desc">Every Ugly Picture of yours<br>becomes my favorite one.</p>
        </div>

        <!-- Floating Images Container -->
        <div class="float-canvas" id="float-canvas">

            <div class="float-img" data-drift="0.3">
                <img src="BestofPurva/20260109_215626.jpg" alt="Purva" class="purva-card">
            </div>

            <div class="float-img" data-drift="0.5">
                <img src="BestofPurva/20260320_201221.jpg" alt="Purva" class="purva-card">
            </div>

            <div class="float-img" data-drift="0.25">
                <img src="BestofPurva/20260322_220857.jpg" alt="Purva" class="purva-card">
            </div>

            <div class="float-img" data-drift="0.4">
                <img src="BestofPurva/20260322_223319.jpg" alt="Purva" class="purva-card">
            </div>

            <div class="float-img" data-drift="0.35">
                <img src="BestofPurva/IMG-20260106-WA0038.jpg" alt="Purva" class="purva-card">
            </div>

            <div class="float-img" data-drift="0.45">
                <img src="BestofPurva/IMG-20260214-WA0182.jpg" alt="Purva" class="purva-card">
            </div>

            <div class="float-img" data-drift="0.3">
                <img src="BestofPurva/Snapchat-429106350.jpg" alt="Purva" class="purva-card">
            </div>

            <div class="float-img" data-drift="0.5">
                <img src="BestofPurva/Snapchat-960236388.jpg" alt="Purva" class="purva-card">
            </div>

            <!-- View All Button -->
            <button class="view-all-btn" id="view-all-btn">View All</button>

        </div>

        <!-- View All Grid Overlay -->
        <div class="view-all-overlay" id="view-all-overlay">
            <button class="view-all-close" id="view-all-close">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" width="24" height="24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M6 18L18 6M6 6l12 12">
                    </path>
                </svg>
            </button>
            <div class="view-all-grid">
                <div class="view-all-item"><img src="BestofPurva/20260109_215626.jpg" alt="Purva"></div>
                <div class="view-all-item"><img src="BestofPurva/20260320_201221.jpg" alt="Purva"></div>
                <div class="view-all-item"><img src="BestofPurva/20260322_220857.jpg" alt="Purva"></div>
                <div class="view-all-item"><img src="BestofPurva/20260322_223319.jpg" alt="Purva"></div>
                <div class="view-all-item"><img src="BestofPurva/IMG-20260106-WA0038.jpg" alt="Purva"></div>
                <div class="view-all-item"><img src="BestofPurva/IMG-20260214-WA0182.jpg" alt="Purva"></div>
                <div class="view-all-item"><img src="BestofPurva/Snapchat-429106350.jpg" alt="Purva"></div>
                <div class="view-all-item"><img src="BestofPurva/Snapchat-960236388.jpg" alt="Purva"></div>
            </div>
        </div>

        <!-- Closing Section -->
        <section class="closing-section">
            <p class="closing-text">
                Thank you for being my favorite part of every day.<br>
                Kaisa laga apko yeah mera gift.
            </p>
            <p class="closing-signature">Happy Birthday Baby</p>
            <a href="index.html" class="closing-back-btn">Start Again</a>
        </section>

    </main>

    <!-- Scripts -->
    <script src="https://unpkg.com/@studio-freight/lenis@1.0.42/dist/lenis.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script src="script.js"></script>
</body>

</html>
